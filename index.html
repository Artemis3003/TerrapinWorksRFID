<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101d1b">
  <meta name="description" content="Terrapin Works makerspace NFC welcome message demonstration.">
  <title>Welcome to Terrapin Works!</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #101d1b; color: #fff; }
    main { width: min(100%, 440px); text-align: center; padding: 42px 28px; border: 1px solid #365349; border-radius: 24px; background: #152622; box-shadow: 0 20px 70px #0004; }
    .eyebrow { color: #a3bdb3; font-size: 12px; font-weight: 700; letter-spacing: .16em; }
    .check { display: grid; place-items: center; margin: 32px auto 24px; width: 76px; height: 76px; border-radius: 50%; background: #173c30; color: #6ee7a2; font-size: 46px; }
    h1 { font-size: clamp(26px, 6vw, 34px); line-height: 1.18; margin: 0 0 20px; }
    p { color: #d4e4dc; font-size: 18px; line-height: 1.6; margin: 0; }
    .smile { color: #6ee7a2; font-size: 24px; font-weight: 700; margin: 20px 0 30px; }
    footer { border-top: 1px solid #365349; padding-top: 20px; color: #91aa9f; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">TERRAPIN WORKS · MAKERSPACE</div>
    <div class="check" aria-hidden="true">✓</div>
    <h1>Welcome to Terrapin Works!</h1>
    <p>You have been successfully authenticated to use the makerspace</p>
    <div class="smile">*[^_^]*</div>
    <footer>NFC Welcome Message · Demonstration only</footer>
  </main>
</body>
</html>
